# Global configuration for Multi-Site Scraper
# Глобальні налаштування для багатосайтового скрапера

# Основні налаштування
global:
  # Вихідна папка для всіх результатів
  output_dir: "output"
  
  # Папка для конфігурацій сайтів
  sites_config_dir: "sites"
  
  # Мова логів (en/uk)
  log_language: "uk"
  
  # Рівень деталізації логів (DEBUG, INFO, WARNING, ERROR)
  log_level: "INFO"

# Налаштування за замовчуванням для парсингу
default_scraping:
  # Формат збереження: json, html або both
  save_format: "json"
  
  # Завантажувати PDF файли
  download_pdf: true
  
  # Кількість паралельних потоків
  parallel_workers: 50
  
  # Затримка між запитами (секунди)
  delay_between_requests: 0.1
  
  # Максимальна кількість повторних спроб
  max_retries: 3
  
  # Timeout для запиту (секунди)
  timeout: 30
  
  # Експоненційна затримка між повторами
  retry_backoff: true
  
  # User-Agent
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

# Налаштування аналізу сайту
analyzer:
  # Час очікування для тесту JS рендерингу (секунди)
  js_test_timeout: 10
  
  # Кількість сторінок для тестування
  test_sample_size: 5
  
  # Перевіряти наявність Cloudflare/защиты
  check_protection: true

# Налаштування підрахунку товарів
counter:
  # Максимальна глибина сканування
  max_depth: 10
  
  # Timeout для швидкого підрахунку (секунди)
  timeout: 60

# Checkpoint система (відновлення після збою)
checkpoint:
  # Включити checkpoint систему
  enabled: true
  
  # Зберігати checkpoint кожні N товарів
  save_every: 1000
  
  # Папка для checkpoint файлів
  checkpoint_dir: "checkpoints"

# Прогрес та логування
progress:
  # Оновлювати прогрес кожні N секунд
  update_interval: 180  # 3 хвилини
  
  # Показувати прогрес-бар в термінал
  show_progress_bar: true
  
  # Логувати помилки в реальному часі
  log_errors_realtime: true

# Проксі (для майбутнього використання)
proxy:
  # Включити проксі
  enabled: false
  
  # Список проксі серверів
  servers: []
  
  # Ротація проксі
  rotate: false

# Специфічні налаштування для різних типів сайтів
site_types:
  # Для статичних сайтів (без JS)
  static:
    scraper: "scrapy"
    parallel_workers: 100
    
  # Для динамічних сайтів (з JS)
  dynamic:
    scraper: "playwright"
    parallel_workers: 10
    headless: true
    
  # Для API-based сайтів
  api:
    scraper: "aiohttp"
    parallel_workers: 200
    
  # Гібридний підхід
  hybrid:
    scraper: "auto"
    parallel_workers: 50



